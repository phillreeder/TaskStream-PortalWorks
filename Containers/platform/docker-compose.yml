version: "3.9"

services:
  taskstream:
    image: node:20-bullseye
    container_name: taskstream-app
    working_dir: /app
    env_file:
      - ../.env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${TASKSTREAM_PORT:-4000}
    volumes:
      - ../../:/app
      - taskstream-node-modules:/app/node_modules
    command: >
      sh -c "npm install && npx prisma migrate deploy && npm run dev"
    ports:
      - "${TASKSTREAM_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - taskstream-net

  postgres:
    extends:
      file: ../postgres/docker-compose.yml
      service: postgres

volumes:
  taskstream-node-modules:

networks:
  taskstream-net:
    name: taskstream-net
